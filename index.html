<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>Hanzi Animation</title>

    <style>
        html, body {
            background-color: #F5F5F5;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hanzi-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hanzi-container {
            width: 80px;
            height: 80px;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="hanzi-group" id="hanziGroup"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.2.1/dist/hanzi-writer.min.js"></script>

    <script>

        class HanziAnimation {

            constructor(options = {}) {

                this.characters = Array.from(options.char || "")
                    .filter(c => /^[\u4e00-\u9fa5]$/.test(c));

                this.container = document.getElementById("hanziGroup");

                this.writers = [];

                this.currentIndex = 0;

                this.init();
            }

            init() {

                this.container.innerHTML = "";

                // Create all characters

                this.characters.forEach((character, index) => {

                    const charContainer = document.createElement("div");

                    charContainer.className = "hanzi-container";

                    this.container.appendChild(charContainer);

                    const writer = HanziWriter.create(
                        charContainer,
                        character,
                        {
                            width: 80,
                            height: 80,
                            padding: 5,
                            showOutline: true,
                            strokeAnimationSpeed: 1.2,
                            delayBetweenStrokes: 280,
                            loop: false
                        }
                    );

                    this.writers.push(writer);

                });

                this.animateNext();
            }

            animateNext() {

                const writer = this.writers[this.currentIndex];

                writer.animateCharacter({
                    onComplete: () => {

                        setTimeout(() => {

                            this.currentIndex =
                                (this.currentIndex + 1) % this.writers.length;

                            this.animateNext();

                        }, 500);

                    }
                });

            }
        }

        function getCharactersFromURL() {

            const params = new URLSearchParams(window.location.search);

            return params.get("chars") || "你好世界";
        }

        window.addEventListener("DOMContentLoaded", () => {

            window.hanziAnimation = new HanziAnimation({
                char: getCharactersFromURL()
            });

        });

    </script>

</body>
</html>
